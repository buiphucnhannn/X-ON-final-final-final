<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .petal-accent { fill: #E09BA8; fill-opacity: 0.18; stroke: #C87888; stroke-width: 0.75; stroke-opacity: 0.32; }
      .bud-accent { fill: #B3586B; fill-opacity: 0.38; }
      .flourish-accent { stroke: #DCA0AD; stroke-width: 0.75; stroke-linecap: round; fill: none; stroke-opacity: 0.3; }
      .gold-accent { fill: #C8A97E; fill-opacity: 0.45; }
      .sparkle-accent { fill: #9E3F55; fill-opacity: 0.28; }
    </style>
  </defs>

  <!-- TOP-RIGHT ACCENT: Floating Floral Emblem -->
  <g transform="translate(1480, 120)">
    <path d="M 0 0 C -10 -15, -12 -30, 0 -38 C 12 -30, 10 -15, 0 0 Z" class="petal-accent" />
    <path d="M 0 0 C -10 15, -12 30, 0 38 C 12 30, 10 15, 0 0 Z" class="petal-accent" />
    <path d="M 0 0 C -15 -10, -30 -12, -38 0 C -30 12, -15 10, 0 0 Z" class="petal-accent" />
    <path d="M 0 0 C 15 -10, 30 -12, 38 0 C 30 12, 15 10, 0 0 Z" class="petal-accent" />
    <circle cx="0" cy="0" r="3" class="bud-accent" />
    <circle cx="0" cy="0" r="1.5" class="gold-accent" />
    <path d="M -30 -40 C -15 -60, 20 -50, 45 -30" class="flourish-accent" />
    <path d="M 30 40 C 15 60, -20 50, -45 30" class="flourish-accent" />
    <path d="M 50 -20 Q 50 -15 45 -15 Q 50 -15 50 -10 Q 50 -15 55 -15 Q 50 -15 50 -20 Z" class="sparkle-accent" />
    <circle cx="65" cy="-35" r="1.5" class="gold-accent" />
  </g>

  <!-- MID-UPPER-LEFT ACCENT: Soft Floating Petal & Starlight -->
  <g transform="translate(140, 360)">
    <path d="M 0 0 C -8 -12, -9 -24, 0 -30 C 9 -24, 8 -12, 0 0 Z" class="petal-accent" />
    <path d="M 0 0 C -8 12, -9 24, 0 30 C 9 24, 8 12, 0 0 Z" class="petal-accent" />
    <path d="M 0 0 C -12 -8, -24 -9, -30 0 C -24 9, -12 8, 0 0 Z" class="petal-accent" />
    <path d="M 0 0 C 12 -8, 24 -9, 30 0 C 24 9, 12 8, 0 0 Z" class="petal-accent" />
    <circle cx="0" cy="0" r="2.5" class="bud-accent" />
    <circle cx="0" cy="0" r="1.2" class="gold-accent" />
    <path d="M 20 -20 C 35 -35, 60 -25, 75 -45" class="flourish-accent" />
    <circle cx="80" cy="-48" r="1.5" class="gold-accent" />
  </g>

  <!-- MID-RIGHT ACCENT: Delicate Curved Stem with Rosette -->
  <g transform="translate(1490, 640)">
    <path d="M 0 0 C -7 -10, -8 -20, 0 -26 C 8 -20, 7 -10, 0 0 Z" class="petal-accent" />
    <path d="M 0 0 C -7 10, -8 20, 0 26 C 8 20, 7 10, 0 0 Z" class="petal-accent" />
    <path d="M 0 0 C -10 -7, -20 -8, -26 0 C -20 8, -10 7, 0 0 Z" class="petal-accent" />
    <path d="M 0 0 C 10 -7, 20 -8, 26 0 C 20 8, 10 7, 0 0 Z" class="petal-accent" />
    <circle cx="0" cy="0" r="2.2" class="bud-accent" />
    <circle cx="0" cy="0" r="1" class="gold-accent" />
    <path d="M -20 20 C -35 35, -60 25, -75 45" class="flourish-accent" />
    <path d="M -40 -15 Q -40 -10 -45 -10 Q -40 -10 -40 -5 Q -40 -10 -35 -10 Q -40 -10 -40 -15 Z" class="sparkle-accent" />
  </g>

  <!-- BOTTOM-LEFT ACCENT: Gentle Organic Branch & Sparkle -->
  <g transform="translate(130, 1050)">
    <path d="M 0 0 C -7 -10, -8 -22, 0 -28 C 8 -22, 7 -10, 0 0 Z" class="petal-accent" />
    <path d="M 0 0 C -7 10, -8 22, 0 28 C 8 22, 7 10, 0 0 Z" class="petal-accent" />
    <path d="M 0 0 C -10 -7, -22 -8, -28 0 C -22 8, -10 7, 0 0 Z" class="petal-accent" />
    <path d="M 0 0 C 10 -7, 22 -8, 28 0 C 22 8, 10 7, 0 0 Z" class="petal-accent" />
    <circle cx="0" cy="0" r="2.5" class="bud-accent" />
    <path d="M 25 -25 C 45 -45, 80 -30, 95 -60" class="flourish-accent" />
    <circle cx="100" cy="-65" r="2" class="gold-accent" />
    <path d="M -25 25 C -45 45, -80 30, -95 60" class="flourish-accent" />
    <path d="M -35 -40 Q -35 -35 -40 -35 Q -35 -35 -35 -30 Q -35 -35 -30 -35 Q -35 -35 -35 -40 Z" class="sparkle-accent" />
  </g>

  <!-- MID-LOWER-RIGHT ACCENT: Petite Star Cluster -->
  <g transform="translate(1440, 960)">
    <circle cx="0" cy="0" r="2" class="gold-accent" />
    <path d="M -15 -15 Q 0 -25 15 -15 Q 25 0 15 15 Q 0 25 -15 15 Q -25 0 -15 -15 Z" class="flourish-accent" />
    <path d="M 0 -10 Q 0 0 -10 0 Q 0 0 0 10 Q 0 0 10 0 Q 0 0 0 -10 Z" class="sparkle-accent" />
    <circle cx="20" cy="-18" r="1.3" class="gold-accent" />
  </g>

  <!-- SCATTERED ETHEREAL MICRO-SPARKLES -->
  <g transform="translate(260, 200)" opacity="0.6">
    <path d="M 0 -8 Q 0 0 -8 0 Q 0 0 0 8 Q 0 0 8 0 Q 0 0 0 -8 Z" class="sparkle-accent" />
    <circle cx="12" cy="10" r="1.2" class="gold-accent" />
  </g>

  <g transform="translate(1360, 420)" opacity="0.55">
    <path d="M 0 -7 Q 0 0 -7 0 Q 0 0 0 7 Q 0 0 7 0 Q 0 0 0 -7 Z" class="sparkle-accent" />
    <circle cx="-10" cy="8" r="1" class="gold-accent" />
  </g>

  <g transform="translate(800, 580)" opacity="0.45">
    <path d="M 0 -6 Q 0 0 -6 0 Q 0 0 0 6 Q 0 0 6 0 Q 0 0 0 -6 Z" class="sparkle-accent" />
    <circle cx="10" cy="-6" r="1.1" class="gold-accent" />
  </g>

  <g transform="translate(220, 780)" opacity="0.55">
    <path d="M 0 -8 Q 0 0 -8 0 Q 0 0 0 8 Q 0 0 8 0 Q 0 0 0 -8 Z" class="sparkle-accent" />
    <circle cx="14" cy="-8" r="1.2" class="gold-accent" />
  </g>
</svg>
