<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .petal { fill: #E09BA8; fill-opacity: 0.16; stroke: #C87888; stroke-width: 0.65; stroke-opacity: 0.28; }
      .center-bud { fill: #B3586B; fill-opacity: 0.35; }
      .flourish { stroke: #DCA0AD; stroke-width: 0.55; stroke-linecap: round; fill: none; stroke-opacity: 0.22; }
      .gold-dot { fill: #C8A97E; fill-opacity: 0.35; }
      .sparkle-soft { fill: #9E3F55; fill-opacity: 0.22; }
    </style>
  </defs>

  <!-- Center Blooming 4-Petal Blossom (Soft, organic, friendly & elegant) -->
  <g transform="translate(40, 40)">
    <!-- Top Petal -->
    <path d="M 0 0 C -6 -8, -7 -17, 0 -20 C 7 -17, 6 -8, 0 0 Z" class="petal" />
    <!-- Bottom Petal -->
    <path d="M 0 0 C -6 8, -7 17, 0 20 C 7 17, 6 8, 0 0 Z" class="petal" />
    <!-- Left Petal -->
    <path d="M 0 0 C -8 -6, -17 -7, -20 0 C -17 7, -8 6, 0 0 Z" class="petal" />
    <!-- Right Petal -->
    <path d="M 0 0 C 8 -6, 17 -7, 20 0 C 17 7, 8 6, 0 0 Z" class="petal" />

    <!-- Center Pistil Accent -->
    <circle cx="0" cy="0" r="1.8" class="center-bud" />
  </g>

  <!-- Corner Mini Floral Accents (Repeats seamlessly across edges) -->
  <g transform="translate(0, 0)">
    <circle cx="0" cy="0" r="1.5" class="center-bud" />
    <path d="M 0 0 C 4 3, 7 3, 9 0 C 7 -3, 4 -3, 0 0 Z" class="petal" />
    <path d="M 0 0 C 3 4, 3 7, 0 9 C -3 7, -3 4, 0 0 Z" class="petal" />
  </g>
  <g transform="translate(80, 0)">
    <circle cx="0" cy="0" r="1.5" class="center-bud" />
    <path d="M 0 0 C -4 3, -7 3, -9 0 C -7 -3, -4 -3, 0 0 Z" class="petal" />
    <path d="M 0 0 C 3 4, 3 7, 0 9 C -3 7, -3 4, 0 0 Z" class="petal" />
  </g>
  <g transform="translate(0, 80)">
    <circle cx="0" cy="0" r="1.5" class="center-bud" />
    <path d="M 0 0 C 4 3, 7 3, 9 0 C 7 -3, 4 -3, 0 0 Z" class="petal" />
    <path d="M 0 0 C -3 -4, -3 -7, 0 -9 C 3 -7, 3 -4, 0 0 Z" class="petal" />
  </g>
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="1.5" class="center-bud" />
    <path d="M 0 0 C -4 -3, -7 -3, -9 0 C -7 3, -4 3, 0 0 Z" class="petal" />
    <path d="M 0 0 C -3 -4, -3 -7, 0 -9 C 3 -7, 3 -4, 0 0 Z" class="petal" />
  </g>

  <!-- Gentle Organic Curved Flourishes -->
  <path d="M 16 24 C 20 20, 24 20, 26 24" class="flourish" />
  <path d="M 64 24 C 60 20, 56 20, 54 24" class="flourish" />
  <path d="M 16 56 C 20 60, 24 60, 26 56" class="flourish" />
  <path d="M 64 56 C 60 60, 56 60, 54 56" class="flourish" />

  <!-- Soft 4-Point Micro Sparkles -->
  <path d="M 20 40 Q 20 43 17 43 Q 20 43 20 46 Q 20 43 23 43 Q 20 43 20 40 Z" class="sparkle-soft" />
  <path d="M 60 40 Q 60 43 57 43 Q 60 43 60 46 Q 60 43 63 43 Q 60 43 60 40 Z" class="sparkle-soft" />
  <path d="M 40 20 Q 40 23 37 23 Q 40 23 40 26 Q 40 23 43 23 Q 40 23 40 20 Z" class="sparkle-soft" />
  <path d="M 40 60 Q 40 63 37 63 Q 40 63 40 66 Q 40 63 43 63 Q 40 63 40 60 Z" class="sparkle-soft" />

  <!-- Warm Champagne Gold Micro-Accents -->
  <circle cx="20" cy="20" r="1.2" class="gold-dot" />
  <circle cx="60" cy="20" r="1.2" class="gold-dot" />
  <circle cx="20" cy="60" r="1.2" class="gold-dot" />
  <circle cx="60" cy="60" r="1.2" class="gold-dot" />
</svg>
