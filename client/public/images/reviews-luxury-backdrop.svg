<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Base Gradient -->
    <radialGradient id="noirSpotlight" cx="65%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#381521" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#220F16" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#120A0D" stop-opacity="1" />
    </radialGradient>

    <!-- Warm Champagne Gold Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ECC68F" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#C8A97E" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#C8A97E" stop-opacity="0" />
    </radialGradient>

    <!-- Rose Velvet Bloom Glow -->
    <radialGradient id="roseBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9E354D" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#6F2436" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1F171A" stop-opacity="0" />
    </radialGradient>

    <!-- Silk Wave Gradient 1 -->
    <linearGradient id="silkGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8A97E" stop-opacity="0.02" />
      <stop offset="35%" stop-color="#E5C79A" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#B23E56" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#C8A97E" stop-opacity="0.02" />
    </linearGradient>

    <!-- Silk Wave Gradient 2 -->
    <linearGradient id="silkGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF1F4" stop-opacity="0.02" />
      <stop offset="45%" stop-color="#F2D0D8" stop-opacity="0.22" />
      <stop offset="85%" stop-color="#8F3349" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1F171A" stop-opacity="0" />
    </linearGradient>

    <!-- Blur Filters for Studio Lighting -->
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
    <filter id="mediumBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="bokehBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- 1. Deep Atmospheric Noir Studio Canvas -->
  <rect width="1920" height="1080" fill="url(#noirSpotlight)" />

  <!-- 2. Ambient Studio Spotlight & Bokeh Blooms -->
  <!-- Main warm aura behind testimonial card (Right area) -->
  <circle cx="1320" cy="520" r="480" fill="url(#roseBloom)" filter="url(#softBlur)" />
  <circle cx="1450" cy="460" r="320" fill="url(#goldGlow)" filter="url(#softBlur)" />

  <!-- Soft secondary aura on left side behind "5.0 Rating" -->
  <circle cx="340" cy="680" r="380" fill="url(#roseBloom)" filter="url(#softBlur)" opacity="0.6" />
  <circle cx="480" cy="720" r="220" fill="url(#goldGlow)" filter="url(#softBlur)" opacity="0.4" />

  <!-- Atmospheric Studio Bokeh Orbs -->
  <circle cx="850" cy="220" r="140" fill="#E8B492" opacity="0.08" filter="url(#bokehBlur)" />
  <circle cx="1680" cy="280" r="180" fill="#E29DAA" opacity="0.10" filter="url(#bokehBlur)" />
  <circle cx="1120" cy="880" r="190" fill="#D6A56C" opacity="0.09" filter="url(#bokehBlur)" />
  <circle cx="210" cy="260" r="130" fill="#B35266" opacity="0.12" filter="url(#bokehBlur)" />
  <circle cx="1780" cy="780" r="150" fill="#E8B89C" opacity="0.07" filter="url(#bokehBlur)" />

  <!-- 3. Flowing Couture Silk Ribbon Waves (Châu Âu Haute Couture draping) -->
  <g opacity="0.85">
    <path d="M -100 850 C 400 950, 750 620, 1200 780 C 1550 900, 1850 720, 2050 640" 
          stroke="url(#silkGrad1)" stroke-width="2.5" fill="none" />
    <path d="M -80 820 C 420 920, 770 590, 1220 750 C 1570 870, 1870 690, 2070 610" 
          stroke="url(#silkGrad1)" stroke-width="1.2" fill="none" opacity="0.6" />

    <path d="M -120 420 C 350 250, 800 680, 1350 380 C 1720 180, 1920 460, 2080 340" 
          stroke="url(#silkGrad2)" stroke-width="2" fill="none" />
    <path d="M -100 450 C 370 280, 820 710, 1370 410 C 1740 210, 1940 490, 2100 370" 
          stroke="url(#silkGrad2)" stroke-width="1.2" fill="none" opacity="0.5" />

    <!-- Delicate golden contour lines -->
    <path d="M 150 1100 C 650 900, 1000 980, 1550 820 C 1800 750, 1980 860, 2100 800" 
          stroke="#ECC68F" stroke-width="1" fill="none" opacity="0.25" stroke-dasharray="8 6" />
  </g>

  <!-- 4. Subtle Filigree Ornamental Watermark (Luxury Editorial Seal) -->
  <g transform="translate(1420, 480)" opacity="0.05" stroke="#FAF1F4" fill="none">
    <!-- Concentric diamond luxury rings -->
    <rect x="-240" y="-240" width="480" height="480" rx="2" transform="rotate(45)" stroke-width="1" />
    <rect x="-190" y="-190" width="380" height="380" rx="2" transform="rotate(45)" stroke-width="1.5" stroke-dasharray="10 8" />
    <circle cx="0" cy="0" r="170" stroke-width="1" />
    <circle cx="0" cy="0" r="230" stroke-width="0.75" />
    <circle cx="0" cy="0" r="290" stroke-width="0.5" stroke-dasharray="4 6" />
  </g>

  <!-- 5. Brilliant 5-Star Luxury Sparkles & Starlight Accents (✦) -->
  <!-- Sparkle cluster top right -->
  <g transform="translate(1560, 240)">
    <path d="M 0 -22 Q 0 0 -22 0 Q 0 0 0 22 Q 0 0 22 0 Q 0 0 0 -22 Z" fill="#FCE4E8" opacity="0.7" />
    <circle cx="0" cy="0" r="3" fill="#FFF" />
    <circle cx="0" cy="0" r="12" fill="#E8B492" opacity="0.2" filter="url(#mediumBlur)" />
  </g>
  <g transform="translate(1620, 290)">
    <path d="M 0 -12 Q 0 0 -12 0 Q 0 0 0 12 Q 0 0 12 0 Q 0 0 0 -12 Z" fill="#ECC68F" opacity="0.6" />
    <circle cx="0" cy="0" r="1.5" fill="#FFF" />
  </g>
  <g transform="translate(1510, 310)">
    <path d="M 0 -9 Q 0 0 -9 0 Q 0 0 0 9 Q 0 0 9 0 Q 0 0 0 -9 Z" fill="#FCE4E8" opacity="0.5" />
  </g>

  <!-- Sparkle cluster mid bottom -->
  <g transform="translate(980, 840)">
    <path d="M 0 -18 Q 0 0 -18 0 Q 0 0 0 18 Q 0 0 18 0 Q 0 0 0 -18 Z" fill="#ECC68F" opacity="0.65" />
    <circle cx="0" cy="0" r="2.5" fill="#FFF" />
  </g>
  <g transform="translate(1040, 890)">
    <path d="M 0 -10 Q 0 0 -10 0 Q 0 0 0 10 Q 0 0 10 0 Q 0 0 0 -10 Z" fill="#E89AA8" opacity="0.55" />
  </g>

  <!-- Sparkle near rating left -->
  <g transform="translate(420, 480)">
    <path d="M 0 -14 Q 0 0 -14 0 Q 0 0 0 14 Q 0 0 14 0 Q 0 0 0 -14 Z" fill="#ECC68F" opacity="0.6" />
    <circle cx="0" cy="0" r="2" fill="#FFF" />
  </g>
  <g transform="translate(240, 680)">
    <path d="M 0 -10 Q 0 0 -10 0 Q 0 0 0 10 Q 0 0 10 0 Q 0 0 0 -10 Z" fill="#FCE4E8" opacity="0.45" />
  </g>

  <!-- Subtle golden starlight micro-dots -->
  <circle cx="680" cy="380" r="1.5" fill="#ECC68F" opacity="0.6" />
  <circle cx="790" cy="620" r="1.2" fill="#FAF1F4" opacity="0.5" />
  <circle cx="1220" cy="340" r="1.8" fill="#ECC68F" opacity="0.7" />
  <circle cx="1380" cy="740" r="1.4" fill="#E89AA8" opacity="0.6" />
  <circle cx="1740" cy="520" r="1.5" fill="#ECC68F" opacity="0.5" />
  <circle cx="560" cy="820" r="1.2" fill="#FAF1F4" opacity="0.5" />
  <circle cx="890" cy="760" r="1.6" fill="#ECC68F" opacity="0.6" />
  <circle cx="1680" cy="640" r="1.2" fill="#E89AA8" opacity="0.5" />

  <!-- 6. Vignette Outer Shade -->
  <rect width="1920" height="1080" fill="none" stroke="#0D0709" stroke-width="80" opacity="0.5" filter="url(#softBlur)" />
</svg>
