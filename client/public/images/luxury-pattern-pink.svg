<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft blush base with delicate geometric diamond linework and 4-point micro sparkles -->
    <style>
      .grid-line { stroke: #D89FA9; stroke-width: 0.6; stroke-dasharray: 2 3; opacity: 0.22; }
      .diamond { fill: none; stroke: #C87A89; stroke-width: 0.7; opacity: 0.25; }
      .sparkle { fill: #8F3349; opacity: 0.22; }
      .accent-dot { fill: #C8A97E; opacity: 0.35; }
    </style>
  </defs>

  <!-- Diagonal delicate grid lines -->
  <line x1="0" y1="0" x2="60" y2="60" class="grid-line" />
  <line x1="60" y1="0" x2="0" y2="60" class="grid-line" />

  <!-- Center Luxury Diamond Motif -->
  <path d="M30 14 L46 30 L30 46 L14 30 Z" class="diamond" />

  <!-- 4-point Micro Sparkle Star in Center -->
  <path d="M30 25 Q30 30 25 30 Q30 30 30 35 Q30 30 35 30 Q30 30 30 25 Z" class="sparkle" />

  <!-- Subtle Corner Corner Accents -->
  <circle cx="0" cy="0" r="1.2" class="accent-dot" />
  <circle cx="60" cy="0" r="1.2" class="accent-dot" />
  <circle cx="0" cy="60" r="1.2" class="accent-dot" />
  <circle cx="60" cy="60" r="1.2" class="accent-dot" />
  <circle cx="30" cy="0" r="0.8" class="accent-dot" />
  <circle cx="0" cy="30" r="0.8" class="accent-dot" />
  <circle cx="60" cy="30" r="0.8" class="accent-dot" />
  <circle cx="30" cy="60" r="0.8" class="accent-dot" />
</svg>
